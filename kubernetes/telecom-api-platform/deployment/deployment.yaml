# Kubernetes API version
apiVersion: apps/v1

# Type of Kubernetes resource
kind: Deployment

metadata:

  # Name of the deployment
  name: telecom-api

  # Namespace where deployment will be created
  namespace: telecom

  # Labels for identifying this deployment
  labels:
    app: telecom-api

spec:

  # Number of pod replicas
  replicas: 2

  # Deployment update strategy
  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  # Deployment manages pods having this label
  selector:
    matchLabels:
      app: telecom-api

  # Blueprint of the Pod
  template:

    metadata:

      labels:
        app: telecom-api

    spec:

      containers:

      - name: telecom-api-container

        image: telecom-api:v1

        imagePullPolicy: Never

        ports:
        - containerPort: 3000

        envFrom:

        - configMapRef:
            name: telecom-api-config

        - secretRef:
            name: telecom-api-secret

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:

          httpGet:
            path: /
            port: 3000

          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:

          httpGet:
            path: /
            port: 3000

          initialDelaySeconds: 20
          periodSeconds: 20

        #########################################
        # Mount Persistent Volume inside Container
        #########################################

        volumeMounts:
        - name: telecom-storage
          mountPath: /data

      #########################################
      # Volumes used by the Pod
      #########################################

      volumes:
      - name: telecom-storage
        persistentVolumeClaim:
          claimName: telecom-pvc
