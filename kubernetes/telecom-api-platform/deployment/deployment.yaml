# Kubernetes API version
apiVersion: apps/v1

# Resource type
kind: Deployment

metadata:
  # Deployment name
  name: telecom-api

  # Namespace where it will be created
  namespace: telecom

  # Labels help identify resources
  labels:
    app: telecom-api

spec:

  # Number of Pod replicas
  replicas: 2

  # Rolling update strategy
  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  # Deployment manages Pods having this label
  selector:
    matchLabels:
      app: telecom-api

  template:

    metadata:

      labels:
        app: telecom-api

    spec:

      containers:

      - name: telecom-api-container

        # Docker image
        image: telecom-api:v1

        # Local image (important for Minikube)
        imagePullPolicy: Never

        ports:
        - containerPort: 3000

        ##################################
        # ConfigMap Environment Variables
        ##################################

        envFrom:

        - configMapRef:
            name: telecom-api-config

        ##################################
        # Secret Environment Variables
        ##################################

        - secretRef:
            name: telecom-api-secret

        ##################################
        # CPU & Memory Requests/Limits
        ##################################

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        ##################################
        # Readiness Probe
        ##################################

        readinessProbe:

          httpGet:
            path: /
            port: 3000

          initialDelaySeconds: 5
          periodSeconds: 10

        ##################################
        # Liveness Probe
        ##################################

        livenessProbe:

          httpGet:
            path: /
            port: 3000

          initialDelaySeconds: 20
          periodSeconds: 20
