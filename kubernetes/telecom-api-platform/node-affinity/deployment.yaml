apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-affinity
  namespace: telecom

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-affinity

  template:
    metadata:
      labels:
        app: nginx-affinity

    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: disktype
                operator: In
                values:
                - hdd

      containers:
      - name: nginx
        image: nginx:latest
