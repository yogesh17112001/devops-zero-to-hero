apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: {{ .Release.Name }}-rolebinding
  namespace: {{ .Release.Namespace }}

subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.rbac.roleName }}
